<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> سمعلي آية</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Amiri', serif;
      background: linear-gradient(135deg, #122063 0%, #63137ec7 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .background {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
    }


    @keyframes float {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(50px); }
    }

    .coin {
      position: absolute;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle at 30% 30%, #cadb66, #e9a53f);
      border-radius: 50%;
      animation: float-coin 4s infinite ease-in-out;
      box-shadow: 0 0 10px rgb(255, 255, 255);
    }

    .coin::before {
      content: '📖';
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }

    .coin1 { top: 15%; left: 10%; animation-delay: 0s; }
    .coin2 { top: 20%; right: 8%; animation-delay: 1s; }
    .coin3 { top: 50%; left: 5%; animation-delay: 2s; }
    .coin4 { top: 60%; right: 12%; animation-delay: 1.5s; }
    .coin5 { top: 80%; left: 20%; animation-delay: 2.5s; }

    @keyframes float-coin {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(180deg); }
    }

    .character {
      position: absolute;
      font-size: 60px;
      animation: rotate-character 8s infinite ease-in-out;
    }


    .char2 {
      top: 70%;
      right: 10%;
      animation-delay: 4s;
    }

    @keyframes rotate-character {
      0%, 100% { transform: translateY(0px) rotate(-5deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    .container {
      text-align: center;
      color: white;
      z-index: 10;
      max-width: 600px;
      padding: 40px;
      animation: fadeIn 1s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.3);
      color: white;
      padding: 10px 25px;
      border-radius: 25px;
      margin-bottom: 20px;
      font-size: 0.95em;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 10px rgb(255, 255, 255);
      animation: slideDown 0.8s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 4em;
      font-weight: bold;
      margin: 20px 0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      animation: zoomIn 1s ease-out 0.3s both;
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .subtitle {
      font-size: 1.3em;
      color: rgba(255, 255, 255, 0.95);
      margin: 15px 0;
      animation: slideUp 1s ease-out 0.6s both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .description {
      font-size: 1.1em;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.8;
      margin: 25px 0;
      animation: slideUp 1s ease-out 0.9s both;
    }

    .cta-button {
      display: inline-block;
      background: black;
      color: #ffffff;
      padding: 15px 50px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1em;
      margin-top: 20px;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      border: none;
      animation: slideUp 1s ease-out 1.2s both;
    }

    .cta-button:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    }

    .cta-button:active {
      transform: translateY(-2px) scale(0.98);
    }

    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.445);
      color: rgb(255, 255, 255);
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      z-index: 100;
      transition: all 0.3s;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.5);
      transform: translateX(-5px);
    }

    .stars {
      position: absolute;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite;
    }

    .star1 { top: 25%; left: 20%; animation-delay: 0s; }
    .star2 { top: 35%; right: 15%; animation-delay: 1s; }
    .star3 { top: 55%; left: 10%; animation-delay: 2s; }
    .star4 { top: 70%; right: 20%; animation-delay: 1.5s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5em;
      }

      .subtitle {
        font-size: 1.1em;
      }

      .description {
        font-size: 1em;
      }

      .container {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="background">

    <div class="coin coin1"></div>
    <div class="coin coin2"></div>
    <div class="coin coin3"></div>
    <div class="coin coin4"></div>
    <div class="coin coin5"></div>

    <div class="character char2">✨</div>
    
  </div>

  <a href="index.html" class="back-link">← العودة</a>

  <div class="container">
    <div class="badge">🌟 عرض خاص</div>
    
    <h1>استمع للقرآن الكريم</h1>
    
    <div class="subtitle">بأصوات الشيوخ المشهورين</div>
    
    <div class="description">
       تجربة استماع فريدة مع أفضل التلاوات القرآنية والتفسيرات الشاملة لكل آية
    </div>

    <a href="https://basira.institute/dashboard" class="cta-button">ابدأ الآن</a>
  </div>

  <script>

    
    document.querySelector('.cta-button').addEventListener('click', function() {
      this.style.transform = 'scale(0.95)';
      setTimeout(() => {
        this.style.transform = '';
      }, 100);
    });

    
    const coins = document.querySelectorAll('.coin');
    coins.forEach(coin => {
      const randomDelay = Math.random() * 5;
      coin.style.animationDelay = randomDelay + 's';
    });
  </script>
</body>
</html>
