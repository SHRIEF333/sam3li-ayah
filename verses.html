<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>القرآن الكريم</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Amiri", serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #ecf0f1;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #5db5d2;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 0 0 20px rgba(93, 181, 210, 0.5);
    }

    .controls {
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 15px;
      border: 2px solid #5db5d2;
      margin-bottom: 20px;
      display: inline-block;
    }

    select {
      padding: 12px 20px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
      background: #2c3e50;
      color: #5db5d2;
      border: 2px solid #5db5d2;
      border-radius: 8px;
      font-family: "Amiri", serif;
    }

    select:hover {
      background: #34495e;
    }

    #surahName {
      margin-top: 15px;
      font-size: 1.3em;
      color: #5db5d2;
      font-weight: bold;
    }

    .iframe-container {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      border: 2px solid #5db5d2;
      padding: 10px;
      margin: 20px auto;
      max-width: 1000px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 10px;
      background: white;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background: #5db5d2;
      color: #1a1a2e;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .back-link:hover {
      background: #27ae60;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8em;
      }

      iframe {
        height: 600px;
      }

      .controls {
        padding: 15px;
      }

      select {
        font-size: 14px;
        padding: 10px 15px;
      }
    }
  </style>
</head>


<script async src="https://www.googletagmanager.com/gtag/js?id=G-7QGQYLD15H"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-7QGQYLD15H');
</script>

<body>
  <h1>📖 القرآن الكريم</h1>

  <div class="controls">
    <select id="surahSelect" onchange="onSurahChange()">
      <option value="">🔍 اختر السورة</option>
    </select>

    <div id="surahName"></div>
  </div>

  <div class="iframe-container">
    <iframe id="quranIframe"></iframe>
  </div>

  <a href="index.html" class="back-link">← العودة للصفحة الرئيسية</a>

  <script>
    const API_LIST = "https://api.alquran.cloud/v1/surah";
    const API_SURAH_DATA = id => `https://api.alquran.cloud/v1/surah/${id}`;

    
    fetch(API_LIST)
      .then(res => res.json())
      .then(data => {
        const select = document.getElementById("surahSelect");
        data.data.forEach(surah => {
          const option = document.createElement("option");
          option.value = surah.number;
          option.textContent = `${surah.number} - ${surah.englishName} (${surah.name})`;
          select.appendChild(option);
        });
      });

    
    function onSurahChange() {
      const id = document.getElementById("surahSelect").value;
      if (id) {
        loadSurah(id);
      }
    }

    
    function loadSurah(id) {
      
      document.getElementById("quranIframe").src =
        `https://tanzil.net/?embed=true#${id}:1`;

      
      fetch(API_SURAH_DATA(id))
        .then(res => res.json())
        .then(data => {
          document.getElementById("surahName").textContent =
            `السورة: ${data.data.name} — عدد الآيات: ${data.data.numberOfAyahs}`;
        })
        .catch(err => {
          console.log("Error:", err);
        });
    }
  </script>

</body>

</html>
