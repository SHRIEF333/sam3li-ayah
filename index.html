<!DOCTYPE html>
<html lang="ar">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="logo.png">
  <title>سمعلي آية</title>

  <style>
    body {
      font-family: 'Amiri', serif;
      background: url(flat-arabic-pattern-background_79603-1826.avif);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      border: 3px solid #b5a76f;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      padding: 20px;
      width: 100%;
      max-width: 650px;
      border-radius: 20px;
    }

    .logo-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: #d7d098;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
    }

    .logo {
      width: 90%;
      height: 90%;
      border-radius: 50%;
      object-fit: cover;
    }

    .surah-item {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      text-align: center;
      background: #d7d098d8;
      font-size: 20px;
      color: #6a4104;
    }

    #ayahPage {
      display: none;
    }

    .ayah-card {
      background: #d7d098d8;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 15px;
    }

    .ayah-text {
      font-size: 22px;
      line-height: 1.8;
      margin-top: 10px;
      display: none;
    }

    .show-btn {
      padding: 10px 14px;
      background: #ab9063;
      color: #ffffff;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .back-btn {
      background-color: #d7d098;
      color: #6a4104;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      margin-bottom: 20px;
      font-size: larger;
    }

    .listen {
      background-color: #d7d098;
      color: #6a4104;
      border-radius: 40px;
      margin-left: 20px;
      padding: 5px;
      text-align: center;
    }

    .muslim-ai-label {
      position: fixed;
      bottom: 95px;
      right: 20px;
      background: #b78842;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      z-index: 9999;
      line-height: 1.4;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo-circle">
      <img src="logo.png" alt="Logo" class="logo">
    </div>

      <h1
      style="text-align:center; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; color: #6a4104;">
      سمعلي آية </h1>


    <div class="listen">
      <h2>
        للسماع بأصوات الشيوخ - ترجمة - تفسير
        <a href="verses.html">اضغط هنا</a>
      </h2>
    </div>

    <p style="text-align:center; color:#6a4104; font-size:14px; margin:20px 0;">
      Made by Shrief Ahmed
    </p>

    <div id="surahPage">
      <div id="surahList"></div>
    </div>

    <div id="ayahPage">
      <button class="back-btn" onclick="backToSurahs()">رجوع</button>
      <h2 id="surahTitle" style="text-align:center; color:#6a4104;"></h2>
      <h3 id="progressText" class="listen"></h3>
      <div id="ayahContainer"></div>
    </div>

  </div>

  <script src="https://cdn.botpress.cloud/webchat/v3.5/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2025/12/12/00/20251212003558-UBI61X2G.js" defer></script>

  <div class="muslim-ai-label">
    Muslim AI<br>
    مساعد إسلامي ذكي<br>
    Islamic AI Assistant
  </div>

  <script>
    const API_SURAHS = "https://api.alquran.cloud/v1/surah";
    const API_SURAH_DATA = id => `https://api.alquran.cloud/v1/surah/${id}`;

    const surahPage = document.getElementById("surahPage");
    const surahList = document.getElementById("surahList");
    const ayahPage = document.getElementById("ayahPage");
    const ayahContainer = document.getElementById("ayahContainer");
    const surahTitle = document.getElementById("surahTitle");
    const progressText = document.getElementById("progressText");

    fetch(API_SURAHS)
      .then(res => res.json())
      .then(data => {
        data.data.forEach(surah => {
          const div = document.createElement("div");
          div.className = "surah-item";
          div.textContent = `${surah.number} - ${surah.name}`;
          div.onclick = () => loadSurah(surah.number, surah.name);
          surahList.appendChild(div);
        });
      });

    function loadSurah(id, name) {
      fetch(API_SURAH_DATA(id))
        .then(res => res.json())
        .then(data => {
          surahPage.style.display = "none";
          ayahPage.style.display = "block";

          surahTitle.textContent = name;
          ayahContainer.innerHTML = "";

          const savedProgress = JSON.parse(localStorage.getItem("lastAyah"));
          progressText.textContent =
            savedProgress && savedProgress.surah == id
              ? `أنت وصلت إلى الآية رقم ${savedProgress.ayah}`
              : "";

          data.data.ayahs.forEach(aya => {
            const card = document.createElement("div");
            card.className = "ayah-card";

            const header = document.createElement("div");
            header.textContent = `آية ${aya.numberInSurah}`;
            header.style.fontWeight = "bold";
            header.style.color = "#6a4104";

            const text = document.createElement("div");
            text.className = "ayah-text";
            text.textContent = aya.text;
            text.style.color = "#6a4104";

            const btn = document.createElement("button");
            btn.className = "show-btn";
            btn.textContent = "إظهار الآية";

            btn.onclick = () => {
              const hidden = text.style.display !== "block";
              text.style.display = hidden ? "block" : "none";
              btn.textContent = hidden ? "إخفاء الآية" : "إظهار الآية";
              if (hidden) {
                localStorage.setItem(
                  "lastAyah",
                  JSON.stringify({ surah: id, ayah: aya.numberInSurah })
                );
                progressText.textContent = `أنت وصلت إلى الآية رقم ${aya.numberInSurah}`;
              }
            };

            card.append(header, text, btn);
            ayahContainer.appendChild(card);
          });
        });
    }

    function backToSurahs() {
      ayahPage.style.display = "none";
      surahPage.style.display = "block";
    }

    setTimeout(() => {
      const label = document.querySelector(".muslim-ai-label");
      if (label) label.style.display = "none";
    }, 5000);
  </script>

</body>
</html>
